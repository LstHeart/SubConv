name: Build personal container image

on:
  push:
    branches:
      - personal
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'LstHeart/SubConv' && github.ref == 'refs/heads/personal'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/lstheart/subconv,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=personal-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=personal-${{ matrix.arch }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          digests=(*)
          [ "${#digests[@]}" -eq 2 ]
          images=()
          for digest in "${digests[@]}"; do
            images+=("ghcr.io/lstheart/subconv@sha256:$digest")
          done
          docker buildx imagetools create -t ghcr.io/lstheart/subconv:personal "${images[@]}"
